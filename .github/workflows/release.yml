name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build skill.zip and publish release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION" || {
            echo "tag $TAG does not match package.json v$VERSION" >&2
            exit 1
          }

      - name: Build skill.zip
        run: bash scripts/package_skill.sh

      - name: Verify package layout
        run: |
          unzip -l dist/skill.zip
          unzip -p dist/skill.zip shenti-coach/SKILL.md | head -8
          unzip -p dist/skill.zip shenti-coach/scripts/vendor/mermaid.min.js | wc -c
          test -s dist/skill.zip.sha256

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/{{TAG}}/$TAG/g" .github/release-notes.md > dist/release-notes.md
          cat dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "shenti-coach $TAG" --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/skill.zip dist/skill.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/skill.zip dist/skill.zip.sha256 \
              --verify-tag \
              --title "shenti-coach $TAG" \
              --notes-file dist/release-notes.md
          fi
